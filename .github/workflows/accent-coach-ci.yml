name: accent-coach CI

on:
  push:
    paths: ["accent-coach/**", ".github/workflows/accent-coach-ci.yml"]
  pull_request:
    paths: ["accent-coach/**", ".github/workflows/accent-coach-ci.yml"]

defaults:
  run:
    working-directory: accent-coach

jobs:
  dsp_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: make dsp

  phonetic_engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "services/phonetic_engine[dev]"
      - run: make engine evals analyze

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: make flutter
